<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b0e">
<title>OUTGOING TOUR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap');
:root{--bg:#050b0e;--text:#f1f0ec;--muted:#aeb7ba;--teal:#55ddd5;--gold:#d9b66f;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-weight:300}
.header{position:sticky;top:0;z-index:20;height:138px;background:rgba(5,11,14,.96);border-bottom:1px solid #182126;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}
.brand{display:flex;align-items:center;gap:28px}
.logo{width:78px;height:78px;border:3px solid var(--teal);border-radius:50%;position:relative}
.logo:after{content:"";position:absolute;inset:16px;border:2px solid rgba(85,221,213,.55);border-radius:50%}
.wordmark{font-size:25px;letter-spacing:7px;line-height:1.1;font-weight:500}
.menu{width:80px;height:80px;border:1px solid var(--gold);background:none;display:grid;place-items:center}
.menu span,.menu span:before,.menu span:after{display:block;width:38px;height:2px;background:#eee;content:"";position:relative}
.menu span:before{position:absolute;top:-11px}
.menu span:after{position:absolute;top:11px}
main{max-width:1040px;margin:auto;padding:64px 4.5vw 100px}
.intro{font-size:27px;line-height:1.55;color:#b8c0c2;max-width:900px;margin:0 0 52px}
.card{position:relative;overflow:hidden;border:1px solid #59605f;min-height:940px;background:#101619}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.28) 58%,rgba(0,0,0,.05) 100%)}
.card-content{position:absolute;z-index:2;left:6%;right:6%;bottom:7%}
.eyebrow{color:var(--gold);font-size:17px;letter-spacing:4px;margin-bottom:20px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:86px;line-height:.9;font-weight:500;margin:0 0 30px}
.desc{font-size:25px;line-height:1.5;color:#e0e3e2;max-width:760px}
.cta{display:inline-block;margin-top:35px;color:var(--gold);font-size:17px;letter-spacing:4px}
.next{height:320px;margin-top:32px;border:1px solid #263238;background:linear-gradient(135deg,#182d50,#071014)}
@media(max-width:600px){
.header{height:142px;padding:0 31px}
.logo{width:78px;height:78px}
.wordmark{font-size:24px;letter-spacing:5px}
.menu{width:80px;height:80px}
main{padding:58px 31px 80px}
.intro{font-size:24px;line-height:1.55;margin-bottom:50px}
.card{min-height:855px}
h1{font-size:65px}
.desc{font-size:23px}
.eyebrow{font-size:15px;letter-spacing:3px}
}
</style>
</head>
<body>
<header class="header">
  <div class="brand">
    <div class="logo"></div>
    <div class="wordmark">OUTGOING<br>TOUR</div>
  </div>
  <button class="menu" aria-label="Menu"><span></span></button>
</header>
<main>
